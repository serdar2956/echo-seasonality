name: Daily data update

on:
  schedule:
    - cron: "30 22 * * *"     # every day 22:30 UTC, after the US close: prices, running-year line, rates, inflation, calendars
    - cron: "50 20 * * 5"     # Fridays 20:50 UTC, right after the CFTC COT release (15:30 New York)
  workflow_dispatch:           # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build page
        run: python scripts/build_site.py _site
      - name: Download data, recompute, validate
        run: python scripts/update.py _site
      - name: Record run (GitHub pauses schedules after 60 days without commits)
        if: github.event_name == 'schedule'
        run: |
          d=$(date -u +%d); [ "$d" = "01" ] || [ "$d" = "15" ] || exit 0
          cp _site/data/meta.json status.json
          git config user.name "echo-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -m "data: status $(date -u +%F)" || exit 0
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
